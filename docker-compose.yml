# Local stack: nginx → PHP-FPM, MariaDB, RabbitMQ, a queue worker and the scheduler.
#   cp .env.example .env && docker compose up -d --build
#   docker compose exec app php artisan key:generate
#   docker compose exec app php artisan migrate --seed   (prints an API token)
x-app: &app
  build: .
  # The worker and the scheduler start before the first migration; they retry until the tables exist.
  restart: unless-stopped
  env_file: .env
  depends_on:
    mariadb: { condition: service_healthy }
    rabbitmq: { condition: service_healthy }
  volumes:
    - erp:/var/www/html/storage/app/erp

services:
  app:
    <<: *app

  worker:
    <<: *app
    command: php artisan queue:work rabbitmq --tries=3 --max-time=3600

  scheduler:
    <<: *app
    command: php artisan schedule:work

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports: ["${EL3KTRON_HTTP_PORT:-8080}:80"]
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./public:/var/www/html/public:ro
    depends_on: [app]

  mariadb:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: el3ktron
      MARIADB_USER: el3ktron
      MARIADB_PASSWORD: el3ktron
      MARIADB_ROOT_PASSWORD: root
    volumes: [db:/var/lib/mysql]
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      retries: 20

  rabbitmq:
    image: rabbitmq:4-management-alpine
    restart: unless-stopped
    ports: ["${EL3KTRON_RABBITMQ_UI_PORT:-15672}:15672"]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      retries: 20

volumes:
  db:
  erp:
